[package]
name = "organism-train"
version = "0.1.0"
edition = "2024"
default-run = "organism-train"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rayon = "1"
anyhow = "1"
tch = { version = "0.22", optional = true }

[features]
default = []
# `torch` links libtorch and nothing more: enough to serve a trained model.
# `gpu` adds the trainer, which compiles a CUDA shim and links CUDA.
torch = ["dep:tch"]
serve = ["torch"]
gpu = ["torch"]

[profile.release]
debug = 1

[build-dependencies]
cc = "1"
