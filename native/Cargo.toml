[package]
name = "organism-train"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rayon = "1"
anyhow = "1"
tch = { version = "0.22", optional = true }

[features]
default = []
gpu = ["dep:tch"]

[profile.release]
debug = 1

[build-dependencies]
cc = "1"
