services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Expose to host so you can connect with `mongosh mongodb://localhost:27017`
    # from your Mac if you want to poke at the data. Drop this if you don't.
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: "3000"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: organism
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mongo_data:
