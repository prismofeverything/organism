<!DOCTYPE html>
<html style="background-color:#111">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FUTURE</title>
    {% style "/assets/bulma/css/bulma.min.css" %}
    {% style "/css/screen.css" %}
    <style>
      body { background-color: #111; margin: 0; }
      html, body { height: 100%; margin: 0; }
      .home-layout {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }
      .cover-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .nav-panel {
        width: 280px;
        min-width: 220px;
        padding: 3rem 2rem 2rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .nav-label {
        color: #555;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.25rem;
        margin-top: 1.25rem;
      }
      .nav-link {
        display: block;
        color: #ccc;
        font-size: 1.1rem;
        padding: 0.4rem 0;
        text-decoration: none;
        border-bottom: 1px solid #222;
        transition: color 0.15s;
      }
      .nav-link:hover {
        color: #fff;
        text-decoration: none;
      }
      .nav-link.player-link {
        color: #f8a;
        font-weight: bold;
      }
      .nav-link.player-link:hover {
        color: #fbc;
      }
    </style>
  </head>
  <body>
    <div class="home-layout">
      <div class="cover-panel">
        <a href="/future" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
          <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"
               style="height:60vh; width:auto;">
            <!-- Concentric rings representing the orbits -->
            <circle cx="200" cy="200" r="190" fill="none" stroke="#333" stroke-width="40"/>
            <circle cx="200" cy="200" r="150" fill="none" stroke="#9944cc" stroke-width="30" opacity="0.6"/>
            <circle cx="200" cy="200" r="115" fill="none" stroke="#4488ee" stroke-width="25" opacity="0.6"/>
            <circle cx="200" cy="200" r="82" fill="none" stroke="#44cc44" stroke-width="20" opacity="0.6"/>
            <circle cx="200" cy="200" r="55" fill="none" stroke="#999" stroke-width="15" opacity="0.6"/>
            <!-- Sun -->
            <circle cx="200" cy="200" r="30" fill="#cc2222" opacity="0.9"/>
            <!-- Beam -->
            <line x1="200" y1="200" x2="200" y2="5" stroke="#ffff00" stroke-width="2" opacity="0.5"/>
          </svg>
        </a>
      </div>

      <nav class="nav-panel">
        {% if session-player %}
          <span class="nav-label">you</span>
          <a class="nav-link player-link" href="/future/player/{{session-player}}">{{session-player}}</a>
          <a class="nav-link" href="/future/create">create</a>
          <a class="nav-link" href="/future/play">play</a>

          <span class="nav-label">explore</span>
          <a class="nav-link" href="/future/rules">rules</a>
          <a class="nav-link" href="/future/observe">observe</a>
          <a class="nav-link" href="/future/generate">generate</a>

          <span class="nav-label" style="margin-top:2rem"></span>
          <a class="nav-link" href="/logout" style="color:#666; font-size:0.9rem">log out</a>
          <a class="nav-link" href="/" style="color:#666; font-size:0.85rem">&larr; games</a>
        {% else %}
          <span class="nav-label">account</span>
          <a class="nav-link" href="/login?redirect=/future">log in</a>
          <a class="nav-link" href="/register?redirect=/future">sign up</a>

          <span class="nav-label">explore</span>
          <a class="nav-link" href="/future/rules">rules</a>
          <a class="nav-link" href="/future/observe">observe</a>
          <a class="nav-link" href="/future/generate">generate</a>
          <a class="nav-link" href="/" style="color:#666; font-size:0.85rem">&larr; games</a>
        {% endif %}
      </nav>
    </div>
  </body>
</html>
