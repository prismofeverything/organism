<!DOCTYPE html>
<html style="background-color:#04040E">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JOURNEY — Bot Editor</title>
    {% style "/assets/bulma/css/bulma.min.css" %}
    {% style "/css/screen.css" %}
  </head>
  <body>
    <div id="journey">
    </div>

    <script type="text/javascript">
      var csrfToken = {{csrf-token|js}};
      var playerKey = {{session-player|js}};
      var playKey = null;
      var isCreate = false;
      var isObserve = false;
      var isGenerate = false;
      var isBotList = false;
      var isBotEditor = true;
      var botGameType = "journey";
      var botBasePath = "/journey/bots";
      var botHomePath = "/journey";
      var preloadedBot = {{bot|js}};
      var preloadedBotName = {{bot-name|js}};
      var preloadedBotOwner = {{bot-owner|js}};
    </script>
    {% script "/js/journey-bots.js" %}
  </body>
</html>
