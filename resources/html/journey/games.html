<!DOCTYPE html>
<html style="background-color:#04040E">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JOURNEY - my games</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #04040E; color: #AABBCC; font-family: monospace; padding: 48px; }
      h2 { color: #7AAAE0; margin-bottom: 24px; }
      .game-list { list-style: none; }
      .game-item {
        display: block;
        padding: 12px 16px;
        margin-bottom: 8px;
        background: #0A0E1C;
        border: 1px solid #2A4A80;
        border-radius: 4px;
        color: #AACCEE;
        text-decoration: none;
        transition: background 0.15s;
      }
      .game-item:hover { background: #10182A; }
      .game-meta { color: #556677; font-size: 0.85rem; margin-top: 4px; }
      .empty { color: #445566; }
      .nav-link {
        display: inline-block;
        color: #556677;
        font-size: 0.9rem;
        margin-top: 24px;
        text-decoration: none;
      }
      .nav-link:hover { color: #AABBCC; }
    </style>
  </head>
  <body>
    <h2>JOURNEY — {{session-player}}'s games</h2>

    <div id="games-list"></div>

    <a class="nav-link" href="/journey">← journey home</a>

    <script type="text/javascript">
      var playerGames = "{{player-games|addslashes|safe}}";
      (function() {
        var container = document.getElementById('games-list');
        try {
          // playerGames is an EDN string; parse minimally for display
          var raw = playerGames;
          if (!raw || raw === '[]' || raw === 'nil') {
            container.innerHTML = '<p class="empty">No games yet. <a href="/journey/create" style="color:#7AAAE0">Create one?</a></p>';
            return;
          }
          // Extract game keys from the EDN vector of maps
          // Simple regex extraction of :key "value" pairs
          var keys = [];
          var re = /:key\s+"([^"]+)"/g;
          var m;
          while ((m = re.exec(raw)) !== null) keys.push(m[1]);
          if (keys.length === 0) {
            // Try keyword keys
            re = /:key\s+:([^\s\}]+)/g;
            while ((m = re.exec(raw)) !== null) keys.push(m[1]);
          }
          if (keys.length === 0) {
            container.innerHTML = '<p class="empty">No games yet. <a href="/journey/create" style="color:#7AAAE0">Create one?</a></p>';
            return;
          }
          var html = '';
          for (var i = 0; i < keys.length; i++) {
            html += '<a class="game-item" href="/journey/play/' + keys[i] + '">' + keys[i] + '</a>';
          }
          container.innerHTML = html;
        } catch(e) {
          container.innerHTML = '<p class="empty">Error loading games</p>';
        }
      })();
    </script>
  </body>
</html>
