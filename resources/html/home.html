<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GAMES</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #111; }
      .catalog {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }
      .game-tile {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border-right: 1px solid #222;
      }
      .game-tile:last-child {
        border-right: none;
      }
      .game-tile img {
        height: 80vh;
        width: auto;
        max-width: 90%;
        object-fit: contain;
        transition: opacity 0.15s;
      }
      .game-tile:hover img {
        opacity: 0.85;
      }
      .game-name {
        color: #666;
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-top: 1.5rem;
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        transition: color 0.15s;
      }
      .game-tile:hover .game-name {
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <div class="catalog">
      <a class="game-tile" href="/organism">
        <img src="/img/rulebook-cover-01.png" alt="ORGANISM"/>
        <span class="game-name">organism</span>
      </a>
      <a class="game-tile" href="/journey">
        <img src="/img/rulebook-cover-01.png" alt="JOURNEY"
             style="transform: rotate(180deg); filter: invert(1);"/>
        <span class="game-name">journey</span>
      </a>
    </div>
  </body>
</html>
