<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GAMES</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #111; }
      .catalog {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }
      .game-tile {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border-right: 1px solid #222;
      }
      .game-tile:last-child {
        border-right: none;
      }
      .game-tile img {
        height: 80vh;
        width: auto;
        max-width: 90%;
        object-fit: contain;
        transition: opacity 0.15s;
      }
      .game-tile svg {
        height: 40vh;
        width: auto;
        transition: opacity 0.15s;
      }
      .game-tile:hover img,
      .game-tile:hover svg {
        opacity: 0.85;
      }
      .game-name {
        color: #666;
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-top: 1.5rem;
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        transition: color 0.15s;
      }
      .game-tile:hover .game-name {
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <div class="catalog">
      <a class="game-tile" href="/organism">
        <img src="/img/rulebook-cover-01.png" alt="ORGANISM"/>
        <span class="game-name">organism</span>
      </a>
      <a class="game-tile" href="/journey">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <polygon points="100,20 180,170 20,170"
                   fill="#E8B800" stroke="#FFD030" stroke-width="2"
                   stroke-linejoin="round"/>
        </svg>
        <span class="game-name">journey</span>
      </a>
      <a class="game-tile" href="/oroboros">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="tg" cx="50%" cy="40%">
              <stop offset="0%" stop-color="#8866CC"/>
              <stop offset="100%" stop-color="#44226A"/>
            </radialGradient>
          </defs>
          <!-- Torus: outer ellipse minus inner hole via even-odd fill -->
          <path d="M 100,38
                   C 148,38 186,62 186,100
                   C 186,138 148,162 100,162
                   C 52,162 14,138 14,100
                   C 14,62 52,38 100,38 Z
                   M 100,68
                   C 72,68 50,82 50,100
                   C 50,118 72,132 100,132
                   C 128,132 150,118 150,100
                   C 150,82 128,68 100,68 Z"
                fill="url(#tg)" fill-rule="evenodd"
                stroke="#AA88DD" stroke-width="1.5"/>
          <!-- Inner shadow for depth -->
          <ellipse cx="100" cy="104" rx="46" ry="28"
                   fill="none" stroke="#22113A" stroke-width="3" opacity="0.5"/>
          <!-- Top highlight -->
          <ellipse cx="100" cy="96" rx="46" ry="28"
                   fill="none" stroke="#BB99EE" stroke-width="1" opacity="0.3"/>
        </svg>
        <span class="game-name">oroboros</span>
      </a>
      <a class="game-tile" href="/chroma">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Chroma: six translucent chits around a dark backlit center -->
          <circle cx="100" cy="100" r="86" fill="#0c0d10" stroke="#222" stroke-width="2"/>
          <circle cx="100" cy="30"  r="20" fill="#22c3d6"/>
          <circle cx="160" cy="65"  r="20" fill="#2f6fd0"/>
          <circle cx="160" cy="135" r="20" fill="#d63cae"/>
          <circle cx="100" cy="170" r="20" fill="#e23b3b"/>
          <circle cx="40"  cy="135" r="20" fill="#f4d030"/>
          <circle cx="40"  cy="65"  r="20" fill="#3fae54"/>
          <circle cx="100" cy="100" r="16" fill="#15171c" stroke="#333" stroke-width="2"/>
        </svg>
        <span class="game-name">chroma</span>
      </a>
      <a class="game-tile" href="/eridu">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Ziggurat -->
          <rect x="30" y="140" width="140" height="20" rx="2"
                fill="#8B6914" stroke="#A8841A" stroke-width="1"/>
          <rect x="45" y="118" width="110" height="20" rx="2"
                fill="#9B7924" stroke="#B8942A" stroke-width="1"/>
          <rect x="60" y="96" width="80" height="20" rx="2"
                fill="#AB8934" stroke="#C8A43A" stroke-width="1"/>
          <rect x="75" y="74" width="50" height="20" rx="2"
                fill="#BB9944" stroke="#D8B44A" stroke-width="1"/>
          <!-- Stars -->
          <circle cx="40" cy="40" r="2" fill="#FFD700" opacity="0.8"/>
          <circle cx="100" cy="25" r="2.5" fill="#FFD700" opacity="0.9"/>
          <circle cx="160" cy="35" r="2" fill="#FFD700" opacity="0.7"/>
          <circle cx="60" cy="55" r="1.5" fill="#FFD700" opacity="0.6"/>
          <circle cx="140" cy="50" r="1.5" fill="#FFD700" opacity="0.6"/>
          <circle cx="80" cy="30" r="1" fill="#FFD700" opacity="0.5"/>
          <circle cx="120" cy="45" r="1" fill="#FFD700" opacity="0.5"/>
        </svg>
        <span class="game-name">eridu</span>
      </a>
    </div>
  </body>
</html>
