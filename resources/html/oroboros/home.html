<!DOCTYPE html>
<html style="background-color:#111">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNIVERSAL</title>
    {% style "/assets/bulma/css/bulma.min.css" %}
    {% style "/css/screen.css" %}
    <style>
      body { background-color: #111; margin: 0; }
      html, body { height: 100%; margin: 0; }
      .home-layout {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }
      .cover-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .cover-title {
        color: #556;
        font-family: monospace;
        font-size: 3rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .nav-panel {
        width: 280px;
        min-width: 220px;
        padding: 3rem 2rem 2rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .nav-label {
        color: #555;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.25rem;
        margin-top: 1.25rem;
      }
      .nav-link {
        display: block;
        color: #ccc;
        font-size: 1.1rem;
        padding: 0.4rem 0;
        text-decoration: none;
        border-bottom: 1px solid #222;
        transition: color 0.15s;
      }
      .nav-link:hover {
        color: #fff;
        text-decoration: none;
      }
      .nav-link.player-link {
        color: #adf;
        font-weight: bold;
      }
      .nav-link.player-link:hover {
        color: #cef;
      }
    </style>
  </head>
  <body>
    <div class="home-layout">
      <div class="cover-panel">
        <a href="/oroboros" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
               style="height:60vh; width:auto;">
            <defs>
              <radialGradient id="tg" cx="50%" cy="40%">
                <stop offset="0%" stop-color="#8866CC"/>
                <stop offset="100%" stop-color="#44226A"/>
              </radialGradient>
            </defs>
            <path d="M 100,38
                     C 148,38 186,62 186,100
                     C 186,138 148,162 100,162
                     C 52,162 14,138 14,100
                     C 14,62 52,38 100,38 Z
                     M 100,68
                     C 72,68 50,82 50,100
                     C 50,118 72,132 100,132
                     C 128,132 150,118 150,100
                     C 150,82 128,68 100,68 Z"
                  fill="url(#tg)" fill-rule="evenodd"
                  stroke="#AA88DD" stroke-width="1.5"/>
            <ellipse cx="100" cy="104" rx="46" ry="28"
                     fill="none" stroke="#22113A" stroke-width="3" opacity="0.5"/>
            <ellipse cx="100" cy="96" rx="46" ry="28"
                     fill="none" stroke="#BB99EE" stroke-width="1" opacity="0.3"/>
          </svg>
        </a>
      </div>

      <nav class="nav-panel">
        {% if session-player %}
          <span class="nav-label">you</span>
          <a class="nav-link player-link" href="/oroboros/player/{{session-player}}">{{session-player}}</a>
          <a class="nav-link" href="/oroboros/create">create</a>
          <a class="nav-link" href="/oroboros/play">play</a>

          <span class="nav-label">explore</span>
          <a class="nav-link" href="/oroboros/rules">rules</a>
          <a class="nav-link" href="/oroboros/observe">observe</a>

          <span class="nav-label" style="margin-top:2rem"></span>
          <a class="nav-link" href="/logout" style="color:#666; font-size:0.9rem">log out</a>
          <a class="nav-link" href="/" style="color:#666; font-size:0.85rem">← games</a>
        {% else %}
          <span class="nav-label">account</span>
          <a class="nav-link" href="/login?redirect=/oroboros">login / register</a>

          <span class="nav-label">explore</span>
          <a class="nav-link" href="/oroboros/rules">rules</a>
          <a class="nav-link" href="/oroboros/observe">observe</a>
          <a class="nav-link" href="/" style="color:#666; font-size:0.85rem">← games</a>
        {% endif %}
      </nav>
    </div>
  </body>
</html>
